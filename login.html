<!DOCTYPE html>
<html lang="en">

<head>
	<!-- Google tag (gtag.js) -->
	<script async src="https://www.googletagmanager.com/gtag/js?id=G-G01E5XMSJH"></script>
	<script>
	  window.dataLayer = window.dataLayer || [];
	  function gtag(){dataLayer.push(arguments);}
	  gtag('js', new Date());

	  gtag('config', 'G-G01E5XMSJH');
	</script>
	<meta charset="UTF-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Northgate - Login</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap">
	<link rel="stylesheet" href="./css/app.css">
	<script src="./js/app.js"></script>
</head>

<body>
	<div class="auth">
		<div class="auth__card">
			<div class="auth__tabs">
				<button class="auth__tab auth__tab--active" data-tab="login" type="button">Login</button>
				<button class="auth__tab" data-tab="forgot" type="button">Forgot Password</button>
			</div>

			<form class="auth__panel auth__panel--active" id="panel-login" novalidate>
				<div class="auth__field">
					<label for="login-email">Email Address</label>
					<input type="email" id="login-email" placeholder="you@example.com">
				</div>
				<div class="auth__field">
					<label for="login-password">Password</label>
					<input type="password" id="login-password" placeholder="Your password">
				</div>
				<button type="submit" class="auth__submit">Login</button>
				<a href="index.html" class="auth__back">Go Back to Home</a>
				<p class="auth__message" id="login-message"></p>
			</form>

			<form class="auth__panel" id="panel-forgot" novalidate>
				<div class="auth__field">
					<label for="forgot-email">Email Address</label>
					<input type="email" id="forgot-email" placeholder="you@example.com">
				</div>
				<button type="submit" class="auth__submit">Reset Password</button>
				<a href="index.html" class="auth__back">Go Back to Home</a>
				<p class="auth__message" id="forgot-message"></p>
			</form>
		</div>
	</div>

	<script>
		// Tab switch between the Login and Forgot Password forms.
		(function () {
			const tabs = document.querySelectorAll('.auth__tab');
			const panels = document.querySelectorAll('.auth__panel');

			tabs.forEach(function (tab) {
				tab.addEventListener('click', function () {
					tabs.forEach(function (t) { t.classList.remove('auth__tab--active'); });
					panels.forEach(function (p) { p.classList.remove('auth__panel--active'); });

					tab.classList.add('auth__tab--active');
					document.getElementById('panel-' + tab.dataset.tab).classList.add('auth__panel--active');
				});
			});

			// Demo only - there is no backend yet.
			panels.forEach(function (form) {
				form.addEventListener('submit', function (event) {
					event.preventDefault();
					form.querySelector('.auth__message').textContent = 'This demo has no backend yet.';
				});
			});
		})();
	</script>
</body>

</html>
